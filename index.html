<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <title>Little List</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #222823;
      --muted: #777d75;
      --paper: #f4f3ed;
      --line: #e3e2da;
      --green: #41634e;
      --green-dark: #304b3a;
      --coral: #c96b54;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d9d8cf 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    button, input { font: inherit; }

    .page {
      width: min(100% - 32px, 580px);
      margin: 0 auto;
      padding: 58px 0 72px;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 34px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .mark {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--green);
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 9vw, 54px);
      font-weight: 400;
      letter-spacing: -1.5px;
      line-height: 1.08;
    }

    .subtitle {
      margin: 12px 0 30px;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffefa;
      box-shadow: 0 5px 18px #343a2510;
    }

    .composer input {
      min-width: 0;
      flex: 1;
      padding: 12px 10px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
    }

    .composer input::placeholder { color: #9a9d94; }

    .add-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 15px;
      border: 0;
      border-radius: 5px;
      color: white;
      background: var(--green);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .add-button:hover { background: var(--green-dark); }
    button:focus-visible, input:focus-visible { outline: 3px solid #c99555; outline-offset: 2px; }

    .list-header {
      display: flex;
      min-height: 66px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .list-header h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 400;
    }

    .filters { display: flex; gap: 4px; }

    .filter {
      padding: 7px 9px;
      border: 0;
      border-radius: 4px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }

    .filter[aria-pressed="true"] {
      color: var(--green-dark);
      background: #e5e9df;
      font-weight: 700;
    }

    .tasks { margin: 0; padding: 0; list-style: none; }

    .task {
      display: flex;
      min-height: 59px;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--line);
      animation: arrive 180ms ease-out both;
    }

    .task-check {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.45;
    }

    .task.done .task-text { color: #92958c; text-decoration: line-through; }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border: 0;
      border-radius: 5px;
      color: #858a81;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
    }

    .delete-button:hover { color: var(--coral); background: #f5e9e4; }

    .empty {
      padding: 34px 12px;
      color: var(--muted);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 17px;
      color: var(--muted);
      font-size: 12px;
    }

    .clear-button {
      padding: 5px 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
      text-decoration-color: #c7c8be;
      text-underline-offset: 3px;
    }

    .clear-button:hover { color: var(--coral); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .page { padding-top: 38px; }
      .list-header { align-items: flex-start; flex-direction: column; justify-content: center; gap: 6px; padding: 12px 0; }
      .filters { width: 100%; }
      .filter { flex: 1; }
      .composer { gap: 4px; }
      .add-button { padding: 0 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline"><span class="mark" aria-hidden="true">✓</span> A little room to think</div>
    <h1>Little List</h1>
    <p class="subtitle">One thing at a time is plenty.</p>

    <form class="composer" id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" aria-label="New task" maxlength="200" autocomplete="off" required>
      <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
    </form>

    <section aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">Your tasks</h2>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter" type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
      </div>
      <ul class="tasks" id="tasks" aria-live="polite"></ul>
      <div class="empty" id="empty-state">A clear list. Add a task to get started.</div>
    </section>

    <footer class="footer">
      <span id="task-count">Nothing pending</span>
      <button class="clear-button" id="clear-done" type="button" hidden>Clear completed</button>
    </footer>
  </main>

  <script>
    const storageKey = "little-list-tasks";
    const taskForm = document.querySelector("#task-form");
    const taskInput = document.querySelector("#task-input");
    const taskList = document.querySelector("#tasks");
    const emptyState = document.querySelector("#empty-state");
    const taskCount = document.querySelector("#task-count");
    const clearDoneButton = document.querySelector("#clear-done");
    const filterButtons = document.querySelectorAll(".filter");
    let activeFilter = "all";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved) ? saved.filter(task => task && typeof task.id === "string" && typeof task.text === "string") : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function renderTasks() {
      const visibleTasks = tasks.filter(task => {
        if (activeFilter === "active") return !task.done;
        if (activeFilter === "done") return task.done;
        return true;
      });

      taskList.replaceChildren();
      for (const task of visibleTasks) {
        const item = document.createElement("li");
        item.className = `task${task.done ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.className = "task-check";
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", `Mark ${task.text} ${task.done ? "to do" : "done"}`);
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const removeButton = document.createElement("button");
        removeButton.className = "delete-button";
        removeButton.type = "button";
        removeButton.textContent = "×";
        removeButton.setAttribute("aria-label", `Delete ${task.text}`);
        removeButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, removeButton);
        taskList.append(item);
      }

      const remaining = tasks.filter(task => !task.done).length;
      emptyState.hidden = visibleTasks.length > 0;
      if (visibleTasks.length === 0 && tasks.length > 0) {
        emptyState.textContent = activeFilter === "done" ? "Nothing completed just yet." : "You're all caught up.";
      } else {
        emptyState.textContent = "A clear list. Add a task to get started.";
      }
      taskCount.textContent = remaining === 1 ? "1 task to go" : `${remaining} tasks to go`;
      clearDoneButton.hidden = !tasks.some(task => task.done);
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ id: crypto.randomUUID(), text, done: false });
      saveTasks();
      taskInput.value = "";
      activeFilter = "all";
      filterButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));
      renderTasks();
      taskInput.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filterButtons.forEach(filter => filter.setAttribute("aria-pressed", String(filter === button)));
        renderTasks();
      });
    });

    clearDoneButton.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
